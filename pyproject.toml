[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verto"
version = "1.0.0"
description = "Natural Language Database Interface Engine — text-to-SQL with T5+LoRA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# The `verto` CLI talking to a running server needs only the standard library.
dependencies = []

[project.optional-dependencies]
# The model: the API server, `verto --local` and scripts/train.py.
local = [
    "torch>=2.1",
    "transformers>=4.40",
    "peft>=0.10",
    "sentencepiece>=0.1.99",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
]
# scripts/run_cloud.py --ngrok
ngrok = ["pyngrok>=7.0"]
# The tests: no model or Spider data needed (httpx runs FastAPI's test client).
dev = ["pytest>=8.0", "fastapi>=0.100", "httpx>=0.27"]

[project.scripts]
# Registers the `verto` command after `pip install -e .`
verto = "verto.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["verto*"]
